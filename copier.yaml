# Copier template for Python projects
# Usage: uvx copier copy --trust gh:namitdeb739/python-template <project-dir>
# Docs:  https://namitdeb739.github.io/python-template

# --- Project identity ---

project_name:
  type: str
  help: Project name in kebab-case (e.g. my-ml-project)
  placeholder: my-project

package_name:
  type: str
  help: Python package name in snake_case (leave blank to auto-derive)
  default: "{{ project_name | replace('-', '_') }}"
  placeholder: my_project

description:
  type: str
  help: Short one-line description
  placeholder: A Python project

author_name:
  type: str
  help: Author full name
  placeholder: Your Name

author_email:
  type: str
  help: Author email
  placeholder: you@example.com

github_user:
  type: str
  help: GitHub username or organisation
  placeholder: your-username

# --- Feature toggles ---

# CI / security
ci_github:
  type: bool
  default: true
  help: Enable GitHub Actions CI/CD?

security:
  type: str
  default: basic
  help: "Security level"
  choices:
    "No security tooling": none
    "Pre-commit hooks + ruff linting": basic
    "Basic + CodeQL, pip-audit, Dependabot, branch protection": full

# Code quality
testing:
  type: str
  default: standard
  help: "Testing level"
  choices:
    "pytest only": minimal
    "pytest + coverage + fixtures": standard
    "Standard + coverage threshold + parametrized examples": full

use_typecheck:
  type: bool
  default: true
  help: Enable mypy strict type checking?

# Documentation & deployment
use_docs:
  type: bool
  default: true
  help: Include MkDocs documentation?

use_docker:
  type: str
  default: cpu
  help: "Docker support"
  choices:
    "No Docker": none
    "CPU Dockerfile + Compose": cpu
    "CPU + GPU Dockerfile": gpu

# Dev environment
use_devcontainer:
  type: bool
  default: false
  help: Include VS Code dev container config?

# Domain-specific extras
use_ml:
  type: str
  default: none
  help: "ML/data science setup"
  choices:
    "No ML setup": none
    "Dirs + notebooks, deps commented (opt-in)": minimal
    "Minimal + pandas/numpy/matplotlib installed + example notebook + data loader": standard
    "Standard + scikit-learn + example pipeline": full

use_webapp:
  type: str
  default: none
  help: "Interactive web app / dashboard scaffold"
  choices:
    "No web app": none
    "Streamlit dashboard": streamlit
    "Plotly Dash app": dash
    "Gradio app": gradio

use_iot:
  type: bool
  default: false
  help: Include IoT/embedded setup (serial, GPIO, MQTT drivers, device config)?

use_cli:
  type: bool
  default: false
  help: Include Typer CLI scaffold (commands, --help, rich output)?

use_api:
  type: bool
  default: false
  help: Include FastAPI REST API scaffold (routes, health endpoint, uvicorn serve)?

use_db:
  type: bool
  default: false
  help: Include SQLAlchemy 2 + Alembic (database session, migrations)?

# --- Post-setup options ---

init_dvc:
  type: bool
  help: Initialise DVC for data versioning?
  default: false
  when: "{{ use_ml != 'none' }}"

init_env:
  type: bool
  help: Create .env from .env.example?
  default: false

# 9.2.0 introduced _copier_operation, which the tasks below rely on.
_min_copier_version: "9.2.0"
_subdirectory: template

_exclude:
  - .git/
  - .venv/
  - site/
  - uv.lock

_tasks:
  # The package directory is templated in its own name, so Copier renders it
  # straight to the right path. Do not reintroduce a post-copy rename here:
  # Copier renders to the template's literal path on update too, so a rename
  # task makes `copier update` nest a fresh copy inside the real package.
  # Remove disabled features
  - command: rm -rf .devcontainer/
    when: "{{ not use_devcontainer }}"
  - command: rm -rf "src/{{ package_name }}/drivers/" "src/{{ package_name }}/sensors/" config/
    when: "{{ not use_iot }}"
  - command: rm -f tests/test_drivers.py
    when: "{{ not use_iot }}"
  - command: rm -f "src/{{ package_name }}/cli.py" tests/test_cli.py
    when: "{{ not use_cli }}"
  - command: rm -rf "src/{{ package_name }}/api/" tests/test_api.py
    when: "{{ not use_api }}"
  - command: rm -rf "src/{{ package_name }}/db/" alembic/ alembic.ini tests/test_db.py
    when: "{{ not use_db }}"
  - command: rm -f "src/{{ package_name }}/app.py" tests/test_app.py
    when: "{{ use_webapp == 'none' }}"
  - command: rm -f "src/{{ package_name }}/data.py" tests/test_data.py notebooks/01_explore.ipynb
    when: "{{ use_ml in ['none', 'minimal'] }}"
  - command: rm -f "src/{{ package_name }}/pipeline.py" tests/test_pipeline.py
    when: "{{ use_ml != 'full' }}"
  - command: rm -rf docker/ .dockerignore
    when: "{{ use_docker == 'none' }}"
  - command: rm -f docker/Dockerfile.gpu
    when: "{{ use_docker != 'gpu' and use_docker != 'none' }}"
  - command: rm -rf docs/ mkdocs.yml
    when: "{{ not use_docs }}"
  - command: rm -rf notebooks/ data/
    when: "{{ use_ml == 'none' }}"
  - command: rm -rf .github/workflows/ .github/dependabot.yml
    when: "{{ not ci_github }}"
  - command: rm -f .github/workflows/codeql.yml .github/workflows/dependabot-auto-merge.yml .github/dependabot.yml
    when: "{{ ci_github and security != 'full' }}"
  - command: rm -f .github/workflows/docs.yml
    when: "{{ ci_github and not use_docs }}"
  - command: rm -f .pre-commit-config.yaml
    when: "{{ security == 'none' }}"
  - command: rm -f tests/conftest.py tests/test_config.py
    when: "{{ testing == 'minimal' }}"
  # Initialise the repo. Copy only — on update the project already has history.
  # `pre-commit install` and `dvc init` both need .git to exist, so this comes
  # before them.
  - command: git init
    when: "{{ _copier_operation == 'copy' }}"
  - command: git config core.longpaths true
    when: "{{ _copier_operation == 'copy' }}"
  # Install dependencies and hooks. Copy only, like the git tasks above: on
  # update Copier also regenerates the old project in a scratch dir to diff
  # against, and these would run there too — installing a venv twice and, with
  # no .git in that scratch dir, failing outright on `pre-commit install`.
  # Run `just setup` after an update if pyproject.toml changed.
  - command: uv sync --dev
    when: "{{ _copier_operation == 'copy' }}"
  - command: uv run pre-commit install
    when: "{{ security != 'none' and _copier_operation == 'copy' }}"
  # Optional extras. Copy only — `dvc init` fails on an initialised repo, and
  # copying .env.example over an existing .env would destroy real secrets.
  - command: uv run dvc init && uv run dvc config core.autostage true
    when: "{{ init_dvc and _copier_operation == 'copy' }}"
  - command: cp .env.example .env
    when: "{{ init_env and _copier_operation == 'copy' }}"
  # Commit last, so uv.lock and any .dvc/ scaffolding land in the initial commit.
  # Committing before `uv sync` left every fresh project dirty with an untracked
  # uv.lock, which made `copier update` refuse to run on it.
  - command: git add -A
    when: "{{ _copier_operation == 'copy' }}"
  - command: 'git commit -m "chore: initial project from template"'
    when: "{{ _copier_operation == 'copy' }}"

_message_after_copy: |

  Project {{ project_name }} is ready!

  Next steps:
    cd {{ project_name }}
    just check          # verify lint + type-check + tests all pass
  {% if ci_github %}
    just init-remote    # create GitHub repo, push, configure branch protection + Pages
  {% else %}
    git init && git add -A && git commit -m "chore: initial commit"
  {% endif %}

  Update later:
    uvx copier update --trust

_message_after_update: |

  {{ project_name }} updated.

  Next steps:
    just setup          # re-sync dependencies if pyproject.toml changed
    just check          # verify lint + type-check + tests all pass

  Review the diff before committing: git diff
